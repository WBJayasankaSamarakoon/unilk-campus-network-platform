<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="capHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E1B4B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  <rect width="64" height="32" rx="16" fill="white" opacity="0.08" />

  <!-- University Graduation Cap (Mortarboard) -->
  <g filter="url(#badgeShadow)">
    <!-- Cap Diamond Top -->
    <path
      d="M32 17 L50 25.5 L32 34 L14 25.5 Z"
      fill="url(#capHighlight)"
    />
    <!-- Cap Skull Base / Band -->
    <path
      d="M21 29.5 V37.5 C21 42.5 32 45.5 32 45.5 C32 45.5 43 42.5 43 37.5 V29.5 L32 34.7 Z"
      fill="#E2E8F0"
    />
    <!-- Tassel and Button -->
    <circle cx="32" cy="25.5" r="2.2" fill="#818CF8" />
    <path
      d="M32 25.5 C37 27 46 31 46 38"
      stroke="#CBD5E1"
      stroke-width="2"
      stroke-linecap="round"
    />
    <!-- Tassel End -->
    <circle cx="46" cy="38" r="2" fill="#FFFFFF" />
  </g>
</svg>
